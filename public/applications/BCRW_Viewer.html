<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PDF Viewer & Download</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: #1e293b;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            font-size: 26px;
            margin-bottom: 8px;
        }

        header p {
            color: #cbd5e1;
            font-size: 14px;
        }

        main {
            width: 100%;
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
            flex: 1;
        }

        .pdf-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .pdf-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            padding: 20px;
            border-bottom: 1px solid #e5e7eb;
        }

        .pdf-info h2 {
            font-size: 20px;
            margin-bottom: 5px;
        }

        .pdf-info p {
            color: #64748b;
            font-size: 14px;
        }

        .download-btn {
            display: inline-block;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .download-btn:hover {
            background-color: #1d4ed8;
        }

        .pdf-viewer {
            width: 100%;
            height: 75vh;
            min-height: 450px;
            border: none;
            display: block;
        }

        .viewer-fallback {
            padding: 30px;
            text-align: center;
            line-height: 1.8;
        }

        .viewer-fallback a {
            color: #2563eb;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #64748b;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 22px;
            }

            main {
                margin: 15px auto;
                padding: 0 10px;
            }

            .pdf-header {
                align-items: stretch;
                flex-direction: column;
            }

            .download-btn {
                text-align: center;
            }

            .pdf-viewer {
                height: 70vh;
                min-height: 400px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>BCRW Doris Holke Memorial Scholarship Application</h1>
        <p>View the application here or download it to your device.</p>
    </header>

    <main>
        <section class="pdf-card">

            <div class="pdf-header">
                <div class="pdf-info">
                    <h2>BCRW Scholarship Application</h2>
                    <p>View the document below or download a copy.</p>
                </div>

                <a
                    href="BCRW_Instructions.pdf"
                    class="download-btn"
                    download="BCRW_Instructions.pdf"
                    id="downloadBtn"
                >
                    &#8681; Download PDF
                </a>
            </div>

            <iframe
                src="BCRW_Instructions.pdf"
                class="pdf-viewer"
                title="PDF Document Viewer"
            >
                <div class="viewer-fallback">
                    Your browser cannot display this PDF.
                    <a href="BCRW_Instructions.pdf" download="BCRW_Instructions.pdf">
                        Click here to download it.
                    </a>
                </div>
            </iframe>

        </section>
    </main>

</body>
</html>
